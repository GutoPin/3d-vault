name: 3d-vault

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      # Solo se cree X-Forwarded-For si viene de Caddy, en esta red.
      TRUSTED_PROXIES: 172.28.0.0/24
    volumes:
      - data:/data
      - ${BACKUP_PATH:-backup}:/backup
    networks:
      - internal
    # Sin puertos publicados: solo se llega a través de Caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      server:
        condition: service_healthy

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  data:
  backup:
  caddy_data:
  caddy_config:
