{{define "content"}}
<div class="login">
  <div class="login-box">
    <div class="brand">{{template "brand"}}3D-Vault</div>
    <h1>Entrar</h1>
    {{if .Error}}<p class="notice" role="alert">{{.Error}}</p>{{end}}
    <form method="post" action="/login">
      <div class="field">
        <label for="username">Usuario</label>
        <input class="input" id="username" name="username" autocomplete="username" autocapitalize="none" required autofocus value="{{.Data.Username}}">
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
  </div>
</div>
{{end}}
